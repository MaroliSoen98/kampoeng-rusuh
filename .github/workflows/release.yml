name: Flutter Android Release

on:
  push:
    branches:
      - main # Workflow akan otomatis berjalan setiap kali kamu melakukan git push ke branch main

permissions:
  contents: write # Diperlukan agar GitHub Action punya izin membuat halaman Release

jobs:
  build_and_release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17' # Java 17 direkomendasikan untuk versi Flutter dan Gradle terbaru

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Rename APK
        # Menggunakan github.run_number agar nama file unik setiap kali push (contoh: Build-1, Build-2)
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Kampoeng Rusuh Build-${{ github.run_number }}.apk"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Auto Release Build #${{ github.run_number }}"
          files: "build/app/outputs/flutter-apk/Kampoeng Rusuh Build-${{ github.run_number }}.apk"
          generate_release_notes: true